name: Deploy Midscene report to Pages

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Actions artifact containing the Midscene HTML reports and previews
        required: true
        type: string
      report-label:
        description: Distribution label shown in report history
        required: true
        type: string
      summary-title:
        description: Product name shown before Midscene in the run summary
        required: true
        type: string
      primary-project:
        description: Midscene Test project used for the main report and preview
        required: true
        type: string
      auxiliary-project:
        description: Midscene Test project used for the second report and preview
        required: true
        type: string
      auxiliary-report-label:
        description: Label for the second project report
        required: true
        type: string
      run-result:
        description: Result of the job that produced the report artifact
        required: false
        default: success
        type: string

jobs:
  deploy:
    name: Publish HTML report history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-report-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the run's HTML report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/midscene-report

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Restore history and prepare the Pages site
        env:
          REPORT_RETENTION: ${{ vars.REPORT_RETENTION || '30' }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          REPORT_LABEL: ${{ inputs.report-label }}
          PRIMARY_PROJECT: ${{ inputs.primary-project }}
          AUXILIARY_PROJECT: ${{ inputs.auxiliary-project }}
          AUXILIARY_REPORT_LABEL: ${{ inputs.auxiliary-report-label }}
        run: |
          node scripts/build-pages-report.mjs \
            --report-dir "$RUNNER_TEMP/midscene-report" \
            --site-dir "$RUNNER_TEMP/pages-site" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --retention "$REPORT_RETENTION" \
            --pages-url "$PAGES_BASE_URL" \
            --label "$REPORT_LABEL" \
            --primary-project "$PRIMARY_PROJECT" \
            --primary-report-label "Doubao Say" \
            --auxiliary-project "$AUXILIARY_PROJECT" \
            --auxiliary-report-label "$AUXILIARY_REPORT_LABEL"

      - name: Upload the restricted Pages payload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy report history to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify every published report endpoint
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/verify-pages-report.mjs \
            --manifest "$RUNNER_TEMP/pages-site/reports/manifest.json" \
            --pages-url "$PAGES_BASE_URL" \
            --run-id "$GITHUB_RUN_ID"

      - name: Add report links to the run summary
        if: always() && steps.deployment.outcome == 'success'
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PRODUCER_RESULT: ${{ inputs.run-result }}
          SUMMARY_TITLE: ${{ inputs.summary-title }}
        run: |
          node scripts/render-ci-report-summary.mjs \
            --manifest "$RUNNER_TEMP/pages-site/reports/manifest.json" \
            --pages-url "$PAGES_BASE_URL" \
            --producer-result "$PRODUCER_RESULT" \
            --run-id "$GITHUB_RUN_ID" \
            --summary-title "$SUMMARY_TITLE" \
            --output "$GITHUB_STEP_SUMMARY"
