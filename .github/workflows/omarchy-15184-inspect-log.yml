name: Recover fixed exported evidence in bounded log chunks
on:
  push:
    branches: [acceptance/omarchy-15184-a1ead6b3]
    paths: [acceptance/omarchy-15184/ci/.inspect-native-log]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect existing redacted archive without rerunning acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/quanru/doubao-say/actions/runs/38525941531 > /tmp/run.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/run.json'))
          assert r['id']==38525941531 and r['head_sha']=='dc99919a0cae61795e2bb7604ec3a1ba6f2e397e' and r['status']=='completed'
          print('Fixed existing run:',r['id'],r['conclusion'])
          PY
          gh api --allow-escape-sequences repos/quanru/doubao-say/actions/jobs/115726181212/logs > /tmp/job.log
          python3 - <<'PY'
          import pathlib,re,base64,hashlib,json
          s=pathlib.Path('/tmp/job.log').read_text()
          m=re.search(r'PR15184_EVIDENCE_BEGIN (\d+) ([a-f0-9]{64})',s);assert m
          encoded=''.join(re.findall(r'PR15184_EVIDENCE_DATA ([A-Za-z0-9+/=]+)',s));data=base64.b64decode(encoded,validate=True)
          assert len(data)==int(m[1]) and hashlib.sha256(data).hexdigest()==m[2]
          print('VERIFIED_ARCHIVE_METADATA',json.dumps({'bytes':len(data),'sha256':m[2],'encoded_length':len(encoded),'chunks_1m':(len(encoded)+999999)//1000000}))
          for line in s.splitlines():
              if len(line)<1000 and re.search(r'Real shell/probe healthy|semantic_validation|PASS.*FAIL.*INCONCLUSIVE|Traceback|AssertionError|Process completed with exit',line):print(line)
          PY
