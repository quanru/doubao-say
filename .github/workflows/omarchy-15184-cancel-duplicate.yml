name: Cancel identified invalid-session acceptance (no inference)
on:
  push:
    branches: [acceptance/omarchy-15184-a1ead6b3]
    paths: [acceptance/omarchy-15184/ci/.cancel-duplicate]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate identity and cancel run using known contaminated SSH launch context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/quanru/doubao-say/actions/runs/38521186461 > /tmp/duplicate.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/duplicate.json'))
          assert j['id']==38521186461 and j['head_sha']=='002bff816986a4114f43178272a9b075e8d5c8ac'
          assert j['head_branch']=='acceptance/omarchy-15184-a1ead6b3' and j['event']=='push'
          assert j['status'] in ['pending','queued','in_progress','waiting']
          PY
          gh api --method POST repos/quanru/doubao-say/actions/runs/38521186461/cancel
