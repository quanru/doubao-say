name: Omarchy 15184 prepare only (no inference)
run-name: Omarchy 15184 fresh VM preflight — no model calls
on:
  push:
    branches: [acceptance/omarchy-15184-a1ead6b3]
    paths:
      - acceptance/omarchy-15184/ci/.run-prepare
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omarchy-15184-prepare-only
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: acceptance/omarchy-15184
    env:
      ACCEPTANCE_DISPOSABLE_CI: '1'
      BUILDER_IMAGE: ghcr.io/archlinux/archlinux@sha256:86092797e32aa19d3f45a831b2873cf557c21c5280e9d197ca7a43c8ea79bcd3
      MAX_REQUESTS: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate harness without model dependencies
        run: python3 ci/validate.py
      - name: Read non-credential model configuration categories only
        env:
          CONFIG_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          CONFIG_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          CONFIG_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
        run: python3 ci/model-metadata-only.py
      - name: Build complete pinned ISO and start real candidate VM
        run: bash ci/prepare-runner.sh
      - name: Report real guest preflight (no UI assertions)
        run: |
          bash ci/guest.sh snapshot prepare-only
          bash ci/guest.sh preflight-report
      - name: Record outcome and stop disposable VM (no upload/cache)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/finish-prepare-only.sh
