name: Preview Midscene report summary

on:
  workflow_call:
    inputs:
      report-label:
        description: Distribution label in the published report manifest
        required: true
        type: string
      summary-title:
        description: Distribution name shown in the summary
        required: true
        type: string
      auxiliary-report-label:
        description: Label for the distribution-specific report
        required: true
        type: string

jobs:
  preview:
    name: CI report layout preview
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Render the current branch layout with published screenshots
        env:
          PAGES_BASE_URL: https://quanru.github.io/doubao-say
          REPORT_LABEL: ${{ inputs.report-label }}
          SUMMARY_TITLE: ${{ inputs.summary-title }}
          AUXILIARY_REPORT_LABEL: ${{ inputs.auxiliary-report-label }}
        run: |
          manifest=$(curl --fail --silent --show-error --location \
            "$PAGES_BASE_URL/reports/manifest.json")
          run_id=$(jq -r --arg label "$REPORT_LABEL" \
            '.reports | map(select(.label == $label)) | first | .runId // empty' \
            <<<"$manifest")
          test -n "$run_id"
          report_url="$PAGES_BASE_URL/reports/$run_id/index.html"
          auxiliary_url="$PAGES_BASE_URL/reports/$run_id/auxiliary-report.html"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # $SUMMARY_TITLE × Midscene · CI layout preview

          This uses the current branch's summary layout with the latest published $REPORT_LABEL screenshots. It does not deploy or modify GitHub Pages.

          ### Doubao Say

          [![Final Doubao Say report node]($PAGES_BASE_URL/reports/$run_id/report-preview.png)]($report_url)

          ### $AUXILIARY_REPORT_LABEL

          [![Final $AUXILIARY_REPORT_LABEL node]($PAGES_BASE_URL/reports/$run_id/auxiliary-report-preview.png)]($auxiliary_url)
          EOF
