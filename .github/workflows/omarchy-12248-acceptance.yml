name: Omarchy 12248 real desktop acceptance (no model)
on:
  push:
    branches: [acceptance/omarchy-12248-f88f533b]
    paths: [acceptance/omarchy-12248/**, .github/workflows/omarchy-12248-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: omarchy-12248-f88f533b
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'quanru/doubao-say' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: acceptance/omarchy-12248
    env:
      ACCEPTANCE_DISPOSABLE_CI: '1'
      BUILDER_IMAGE: ghcr.io/archlinux/archlinux@sha256:86092797e32aa19d3f45a831b2873cf557c21c5280e9d197ca7a43c8ea79bcd3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build and boot pinned disposable VM
        run: bash ci/prepare-runner.sh
      - name: Build pinned Midscene without model credentials
        run: bash ci/build-midscene.sh
      - name: Install locked desktop dependencies
        run: npm --prefix ci ci --ignore-scripts
      - name: Compare baseline and head on real desktop
        timeout-minutes: 15
        run: bash ci/run-ui.sh
      - name: Restore and preserve evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/finalize.sh
      - name: Export sanitized raw evidence through job log
        if: always()
        run: python3 ci/export-evidence-log.py
