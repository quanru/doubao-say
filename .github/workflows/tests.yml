name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-report-history:
    name: Pages report history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Statically check and test Pages history builder
        run: |
          node --check scripts/build-pages-report.mjs
          node --check scripts/render-ci-report-summary.mjs
          node --check scripts/verify-pages-report.mjs
          node --check tests/contracts/test_pages_report_history.mjs
          node --test tests/contracts/test_pages_report_history.mjs
  core-compatibility:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install core dependencies
        run: python -m pip install -r packaging/runtime-requirements.txt
      - name: Test platform-independent behavior
        env:
          PYTHONPATH: src:.
        run: |
          python -m unittest -v \
            tests.unit.test_delivery tests.unit.test_gesture tests.unit.test_input_worker \
            tests.unit.test_manual_safety tests.unit.test_plugin_launch tests.unit.test_polish \
            tests.unit.test_polish_preview tests.unit.test_reasoning tests.unit.test_settings \
            tests.unit.test_updates tests.contracts.test_version_check tests.unit.test_voice_motion
          python -m compileall -q src/doubao_input packaging

  full-suite:
    name: Full suite and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo gir1.2-gtk-4.0 python3-venv libportaudio2
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r packaging/runtime-requirements.txt -r requirements-dev.txt
      - name: Lint, test and enforce branch coverage
        run: |
          make lint
          make coverage
          make compile
          git show --format= --check HEAD
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  source-package:
    name: Source and package contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate version and package tests
        env:
          PYTHONPATH: src:.
        run: |
          python packaging/version_check.py
          python -m unittest -v tests.contracts.test_release tests.contracts.test_marketplace tests.contracts.test_version_check
