name: Ubuntu 22.04
run-name: Ubuntu 22.04

# TEMPORARILY DISABLED (2026-09): the Volcengine Ark endpoint backing
# MIDSCENE_MODEL_* is rate-limited to ~25-35 RPM, so the parallel visual
# fleet exhausts its quota. Only the Omarchy visual workflow runs on
# push/PR while quotas are being raised; this suite stays available via
# "Run workflow". To restore automatic runs, replace this trigger block
# with the previous push/pull_request block from git history.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Run one Midscene project for focused verification
        type: choice
        default: all
        options:
          - all
          - ubuntu-product
          - ubuntu-polishing
          - ubuntu-providers

permissions:
  contents: read

concurrency:
  # These workflows use the same model credentials and token quota. Keep a
  # running visual suite alive and queue the newest suite across branches.
  group: midscene-model-e2e
  cancel-in-progress: false

jobs:
  ubuntu-e2e:
    name: Midscene visual (ubuntu)
    outputs:
      report-artifact-id: ${{ steps.report.outputs.artifact-id }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      PROJECT: ${{ inputs.project || 'all' }}
      PROJECTS: ${{ (inputs.project == '' || inputs.project == 'all') && 'ubuntu-product,ubuntu-polishing' || inputs.project }}
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_REASONING_ENABLED: ${{ secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
      MIDSCENE_COMPUTER_HEADLESS_LINUX: "true"
      MIDSCENE_REPLANNING_CYCLE_LIMIT: "40"
      # The Ark endpoint answers bursts with 429; retry up to 3 extra times
      # with a 65s fixed pause so the wait spans the 60s RPM window.
      MIDSCENE_MODEL_RETRY_COUNT: "3"
      MIDSCENE_MODEL_RETRY_INTERVAL: "65000"
      # The configured model endpoint is reachable over IPv4; disabling Node's
      # family race avoids intermittent runner-side IPv6 connection timeouts.
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Require Midscene model configuration
        run: |
          test -n "$MIDSCENE_MODEL_API_KEY"
          test -n "$MIDSCENE_MODEL_NAME"
          test -n "$MIDSCENE_MODEL_BASE_URL"
          test -n "$MIDSCENE_MODEL_FAMILY"

      - name: Check Midscene model connectivity over Node.js
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.MIDSCENE_MODEL_BASE_URL.replace(/\/+$/, '');
          const response = await fetch(`${baseUrl}/chat/completions`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.MIDSCENE_MODEL_API_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: process.env.MIDSCENE_MODEL_NAME,
              messages: [{ role: 'user', content: 'Reply OK.' }],
              max_tokens: 1,
            }),
            signal: AbortSignal.timeout(90_000),
          });
          if (!response.ok) {
            throw new Error(`Model preflight returned HTTP ${response.status}`);
          }
          await response.arrayBuffer();
          NODE

      - name: Install desktop test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            adwaita-icon-theme dbus-x11 fluxbox fonts-noto-cjk \
            gir1.2-gtk-4.0 gnome-themes-extra imagemagick \
            libasound2 libatk-bridge2.0-0 libdrm2 libgbm1 libgtk-3-0 \
            libnotify4 libnss3 libpng16-16 libsecret-1-0 libx11-6 \
            libxinerama1 libxkbcommon-x11-0 libxss1 libxtst6 \
            python3-cairo python3-gi python3-tomli \
            x11-xserver-utils xdg-utils xvfb

      - name: Install pinned Midscene dependencies
        id: test-dependencies
        working-directory: tests/e2e
        # sharp's platform packages are pinned explicitly. Skipping lifecycle
        # scripts avoids npm trying to build sharp before those packages link.
        run: |
          for attempt in 1 2 3; do
            if npm ci --include=optional --ignore-scripts; then
              exit 0
            fi
            echo "npm install attempt $attempt failed; retrying." >&2
            sleep 10
          done
          exit 1

      - name: Run Midscene project
        id: midscene-test
        timeout-minutes: 220
        working-directory: tests/e2e
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection --require=./node_modules/@computer-use/libnut/dist/import_libnut.js
        run: |
          IFS=',' read -r -a projects <<< "$PROJECTS"
          result=0
          for project in "${projects[@]}"; do
            timeout --signal=TERM --kill-after=10s 180m npm test -- --project "$project" || result=1
          done
          exit "$result"

      - name: Capture report evidence
        id: capture-report
        if: always() && !cancelled() && steps.test-dependencies.outcome == 'success'
        run: |
          node tests/e2e/capture-report-preview.mjs \
            --report-dir tests/e2e/midscene_run \
            --projects "$PROJECTS"

      - name: Record project results for report aggregation
        if: always() && !cancelled()
        env:
          TEST_OUTCOME: ${{ steps.midscene-test.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture-report.outcome }}
        run: |
          IFS=',' read -r -a projects <<< "$PROJECTS"
          for project in "${projects[@]}"; do
            node scripts/write-ci-project-status.mjs \
              --output "tests/e2e/midscene_run/ci-project-status-$project.json" \
              --project "$project" \
              --test-outcome "${TEST_OUTCOME:-skipped}" \
              --capture-outcome "${CAPTURE_OUTCOME:-skipped}"
          done

      - name: Upload Midscene report
        id: report
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ubuntu-22.04-e2e-report
          path: |
            tests/e2e/midscene_run/
            tests/e2e/.midscene/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Write test results to Summary
        if: always()
        run: |
          {
            found=false
            for result in tests/e2e/.midscene/test-results/*/result.md; do
              [ -f "$result" ] || continue
              found=true
              # The native report link is local to the downloaded artifact.
              sed '/^\[Open the Midscene Test report ↗\](/d' "$result"
              echo
            done
            if [ "$found" = false ]; then
              echo "Midscene did not produce a test result. Check the preceding steps for setup or model verification failures."
              echo
            fi
            echo "[Download test artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

  pages-report:
    name: GitHub Pages report
    needs: ubuntu-e2e
    if: >-
      always() &&
      !cancelled() &&
      needs.ubuntu-e2e.outputs.report-artifact-id != '' &&
      (inputs.project == '' || inputs.project == 'all') &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-midscene-report.yml
    with:
      artifact-name: midscene-ubuntu-22.04-e2e-report
      report-label: Ubuntu 22.04
      summary-title: Ubuntu
      report-groups: >-
        [{"role":"primary","label":"Doubao Say","projects":["ubuntu-product"]},{"role":"auxiliary","label":"Polishing overlay report","projects":["ubuntu-polishing"]}]
      run-result: ${{ needs.ubuntu-e2e.result }}
