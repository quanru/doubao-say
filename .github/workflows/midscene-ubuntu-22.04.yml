name: Ubuntu 22.04
run-name: Ubuntu 22.04

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/midscene-ubuntu-22.04.yml"
      - ".github/workflows/deploy-midscene-report.yml"
      - "scripts/build-pages-report.mjs"
      - "tests/contracts/test_pages_report_history.mjs"
      - "tests/e2e/package.json"
      - "tests/e2e/package-lock.json"
      - "tests/e2e/gtk_fixture.py"
      - "tests/e2e/is-transient-midscene-failure.sh"
      - "tests/e2e/capture-report-preview.mjs"
      - "tests/e2e/polish_fixture.py"
      - "tests/e2e/cases/**"
      - "tests/e2e/midscene.config.ts"
      - "src/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/midscene-ubuntu-22.04.yml"
      - ".github/workflows/deploy-midscene-report.yml"
      - "scripts/build-pages-report.mjs"
      - "tests/contracts/test_pages_report_history.mjs"
      - "tests/e2e/package.json"
      - "tests/e2e/package-lock.json"
      - "tests/e2e/gtk_fixture.py"
      - "tests/e2e/is-transient-midscene-failure.sh"
      - "tests/e2e/capture-report-preview.mjs"
      - "tests/e2e/polish_fixture.py"
      - "tests/e2e/cases/**"
      - "tests/e2e/midscene.config.ts"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep only one pending run for this workflow and ref. Ubuntu, Omarchy, main,
  # and unrelated PRs must not replace one another in GitHub's concurrency queue.
  group: midscene-model-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-gtk:
    name: Midscene onboarding
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_REASONING_ENABLED: ${{ secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
      MIDSCENE_COMPUTER_HEADLESS_LINUX: "true"
      MIDSCENE_REPLANNING_CYCLE_LIMIT: "40"
      # GitHub's Ubuntu 22.04 runner intermittently times out while Node races
      # IPv4 and IPv6 addresses. The model endpoint is reachable over IPv4.
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    outputs:
      report-artifact-id: ${{ steps.report.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Require Midscene model configuration
        run: |
          test -n "$MIDSCENE_MODEL_API_KEY"
          test -n "$MIDSCENE_MODEL_NAME"
          test -n "$MIDSCENE_MODEL_BASE_URL"
          test -n "$MIDSCENE_MODEL_FAMILY"

      - name: Check Midscene model connectivity over Node.js
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.MIDSCENE_MODEL_BASE_URL.replace(/\/+$/, '');
          const response = await fetch(`${baseUrl}/chat/completions`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.MIDSCENE_MODEL_API_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: process.env.MIDSCENE_MODEL_NAME,
              messages: [{ role: 'user', content: 'Reply OK.' }],
              max_tokens: 1,
            }),
            signal: AbortSignal.timeout(90_000),
          });
          if (!response.ok) {
            throw new Error(`Model preflight returned HTTP ${response.status}`);
          }
          await response.arrayBuffer();
          NODE

      - name: Install desktop test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            adwaita-icon-theme dbus-x11 fluxbox fonts-noto-cjk \
            gir1.2-gtk-4.0 gnome-themes-extra imagemagick \
            libasound2 libatk-bridge2.0-0 libdrm2 libgbm1 libgtk-3-0 \
            libnotify4 libnss3 libpng16-16 libsecret-1-0 libx11-6 \
            libxinerama1 libxkbcommon-x11-0 libxss1 libxtst6 \
            python3-cairo python3-gi python3-tomli \
            x11-xserver-utils xdg-utils xvfb

      - name: Install pinned Midscene dependencies
        working-directory: tests/e2e
        # sharp's platform packages are pinned explicitly. Skipping lifecycle
        # scripts avoids an npm ordering bug that tries to build sharp before
        # those prebuilt packages are linked.
        run: |
          for attempt in 1 2 3; do
            if npm ci --include=optional --ignore-scripts; then
              exit 0
            fi
            echo "npm install attempt $attempt failed; retrying." >&2
            sleep 10
          done
          exit 1

      - name: Run Ubuntu 22.04 Midscene E2E
        working-directory: tests/e2e
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection --require=./node_modules/@computer-use/libnut/dist/import_libnut.js
        run: |
          set -o pipefail
          midscene_passed=false
          for test_attempt in 1 2 3; do
            attempt_log="/tmp/ubuntu-midscene-attempt-${test_attempt}.log"
            if npm test -- --project ubuntu 2>&1 | tee "$attempt_log"; then
              midscene_passed=true
              break
            fi

            if ! ./is-transient-midscene-failure.sh "$attempt_log"; then
              echo "Ubuntu Midscene failed for a non-transient reason; not retrying." >&2
              exit 1
            fi
            if [[ $test_attempt -lt 3 ]]; then
              echo "Transient model or connection failure on attempt ${test_attempt}; retrying in 10 seconds." >&2
              sleep 10
            fi
          done

          if [[ $midscene_passed != true ]]; then
            echo "Ubuntu Midscene exhausted three transient-failure attempts." >&2
            exit 1
          fi

      - name: Verify polishing overlay with Midscene
        working-directory: tests/e2e
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection --require=./node_modules/@computer-use/libnut/dist/import_libnut.js
        run: |
          set -o pipefail
          polishing_passed=false
          for test_attempt in 1 2 3 4; do
            attempt_log="/tmp/ubuntu-polishing-midscene-attempt-${test_attempt}.log"
            if timeout --signal=TERM --kill-after=10s 10m \
                npm test -- --project ubuntu-polishing 2>&1 | tee "$attempt_log"; then
              polishing_passed=true
              break
            fi

            if ! ./is-transient-midscene-failure.sh "$attempt_log"; then
              echo "Ubuntu polishing Midscene failed for a non-transient reason; not retrying." >&2
              exit 1
            fi
            if [[ $test_attempt -lt 4 ]]; then
              retry_delay=$((15 * test_attempt))
              echo "Transient model or connection failure on polishing attempt ${test_attempt}; retrying in ${retry_delay} seconds." >&2
              sleep "$retry_delay"
            fi
          done

          if [[ $polishing_passed != true ]]; then
            echo "Ubuntu polishing Midscene exhausted four transient-failure attempts." >&2
            exit 1
          fi

      - name: Capture the final report node for the CI summary
        if: always()
        run: node tests/e2e/capture-report-preview.mjs

      - name: Upload Midscene report
        id: report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ubuntu-22.04-e2e-report
          path: tests/e2e/midscene_run/
          if-no-files-found: warn
          retention-days: 7

  pages-report:
    name: GitHub Pages report
    needs: ubuntu-gtk
    if: >-
      always() &&
      needs.ubuntu-gtk.outputs.report-artifact-id != '' &&
      github.event_name != 'pull_request' &&
      github.ref_name == vars.PAGES_REPORT_BRANCH
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-midscene-report.yml
    with:
      artifact-name: midscene-ubuntu-22.04-e2e-report
      report-label: Ubuntu 22.04
      summary-title: Ubuntu
      run-result: ${{ needs.ubuntu-gtk.result }}
