name: Recover existing Omarchy evidence (no inference)
on:
  push:
    branches: [acceptance/omarchy-15184-a1ead6b3]
    paths: [acceptance/omarchy-15184/ci/.recover-evidence]
permissions:
  actions: read
  contents: write
jobs:
  recover:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Decode already exported sanitized evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/quanru/doubao-say/actions/jobs/115294720215/logs > /tmp/existing-job.log
          python3 acceptance/omarchy-15184/ci/recover-evidence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acceptance/omarchy-15184/evidence
          git commit -m 'Preserve existing run 38397021675 review evidence'
          git push origin HEAD:acceptance/omarchy-15184-a1ead6b3
