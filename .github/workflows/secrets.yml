name: Secret scanning
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download pinned scanner and verify checksum
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history and checkout (redacted; no reports uploaded)
        run: |
          scan_status=0
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json" || scan_status=$?
          if [ "$scan_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/gitleaks-history.json" <<'PY'
          import json, pathlib, sys
          report = pathlib.Path(sys.argv[1])
          if report.exists():
              for finding in json.loads(report.read_text()):
                  # Never print matched lines, secrets, authors, or commit messages.
                  print(json.dumps({key: finding.get(key) for key in
                                    ("RuleID", "File", "StartLine", "Commit")}))
          PY
            exit "$scan_status"
          fi
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
