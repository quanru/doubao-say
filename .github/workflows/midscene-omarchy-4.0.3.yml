name: Omarchy 4.0.3
run-name: Omarchy 4.0.3

on:
  push:
    branches: [main]
    paths: &e2e-paths
      - ".github/workflows/midscene-omarchy-4.0.3.yml"
      - ".github/workflows/deploy-midscene-report.yml"
      - "scripts/build-pages-report.mjs"
      - "scripts/report-cases.mjs"
      - "scripts/render-ci-report-summary.mjs"
      - "scripts/write-ci-project-status.mjs"
      - "scripts/verify-pages-report.mjs"
      - "scripts/verify-omarchy-evidence.mjs"
      - "scripts/omarchy-shell-evidence.mjs"
      - "tests/contracts/test_pages_report_history.mjs"
      - "tests/contracts/test_model_rate_gate.mjs"
      - "tests/e2e/package.json"
      - "tests/e2e/package-lock.json"
      - "tests/e2e/gtk_fixture.py"
      - "tests/e2e/gtk_onboarding_fixture.py"
      - "tests/e2e/gtk_runtime_fixture.py"
      - "tests/e2e/capture-report-preview.mjs"
      - "tests/e2e/cases/**"
      - "tests/e2e/midscene.config.ts"
      - "tests/e2e/model-rate-gate.mjs"
      - "tests/e2e/run-omarchy-midscene.sh"
      - "tests/e2e/restore-omarchy-vm.sh"
      - "tests/e2e/omarchy-vm.env"
      - "src/**"
      - "manifest.json"
      - "install.sh"
      - "setup-omarchy.sh"
      - "start.sh"
      - "omarchy/**"
  pull_request:
    branches: [main]
    paths: *e2e-paths
  workflow_dispatch:
    inputs:
      project:
        description: Run one Midscene project for focused verification
        type: choice
        default: all
        options:
          - all
          - omarchy-product
          - omarchy-shell
          - omarchy-providers

permissions:
  contents: read
  packages: read

concurrency:
  # These workflows use the same model credentials and token quota. Keep a
  # running visual suite alive and queue the newest suite across branches.
  group: midscene-model-e2e
  cancel-in-progress: false

jobs:
  omarchy-e2e:
    name: Midscene visual (omarchy)
    outputs:
      report-artifact-id: ${{ steps.report.outputs.artifact-id }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PROJECT: ${{ inputs.project || 'all' }}
      PROJECTS: ${{ (inputs.project == '' || inputs.project == 'all') && 'omarchy-product,omarchy-shell' || inputs.project }}
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_REASONING_ENABLED: ${{ secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
      MIDSCENE_COMPUTER_HEADLESS_LINUX: "true"
      MIDSCENE_REPLANNING_CYCLE_LIMIT: "40"
      # The Ark endpoint answers bursts with 429; retry up to 3 extra times
      # with a 65s fixed pause so the wait spans the 60s RPM window.
      MIDSCENE_MODEL_RETRY_COUNT: "3"
      MIDSCENE_MODEL_RETRY_INTERVAL: "65000"
      # The configured model endpoint is reachable over IPv4; disabling Node's
      # family race avoids intermittent runner-side IPv6 connection timeouts.
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Midscene model configuration
        run: |
          test -n "$MIDSCENE_MODEL_API_KEY"
          test -n "$MIDSCENE_MODEL_NAME"
          test -n "$MIDSCENE_MODEL_BASE_URL"
          test -n "$MIDSCENE_MODEL_FAMILY"

      - name: Check Midscene model before the expensive VM install
        run: |
          payload=$(jq -nc --arg model "$MIDSCENE_MODEL_NAME" '{
            model: $model,
            messages: [{role: "user", content: "Reply OK."}],
            max_tokens: 1
          }')
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --retry 4 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
            -H "Authorization: Bearer $MIDSCENE_MODEL_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${MIDSCENE_MODEL_BASE_URL%/}/chat/completions" \
            >/dev/null

      - name: Install ORAS client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Sign in to GitHub Container Registry
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ github.token }}

      - name: Restore prebuilt Omarchy VM
        run: tests/e2e/restore-omarchy-vm.sh

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Midscene and VNC bridge
        id: test-dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            fluxbox tigervnc-viewer x11-xserver-utils xvfb
          for attempt in 1 2 3; do
            if npm --prefix tests/e2e ci --include=optional --ignore-scripts; then
              exit 0
            fi
            echo "npm install attempt $attempt failed; retrying." >&2
            sleep 10
          done
          exit 1

      - name: Run real Omarchy Midscene project
        id: midscene-test
        run: timeout --signal=TERM --kill-after=10s 220m tests/e2e/run-omarchy-midscene.sh "$PROJECT"

      - name: Capture report evidence
        id: capture-report
        if: always() && !cancelled() && steps.test-dependencies.outcome == 'success'
        run: |
          node tests/e2e/capture-report-preview.mjs \
            --report-dir tests/e2e/midscene_run \
            --projects "$PROJECTS"

      - name: Record project results for report aggregation
        if: always() && !cancelled()
        env:
          TEST_OUTCOME: ${{ steps.midscene-test.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture-report.outcome }}
        run: |
          IFS=',' read -r -a projects <<< "$PROJECTS"
          for project in "${projects[@]}"; do
            node scripts/write-ci-project-status.mjs \
              --output "tests/e2e/midscene_run/ci-project-status-$project.json" \
              --project "$project" \
              --test-outcome "${TEST_OUTCOME:-skipped}" \
              --capture-outcome "${CAPTURE_OUTCOME:-skipped}"
          done

      - name: Upload installer evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-vm-installer-evidence
          path: .midscene-omarchy/omarchy-iso/test-runs/**/runs/**
          if-no-files-found: warn
          retention-days: 3
          overwrite: true

      - name: Upload Omarchy Midscene report
        id: report
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-midscene-e2e-report
          path: |
            tests/e2e/midscene_run/
            tests/e2e/.midscene/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Verify Omarchy shell visual evidence
        if: success() && (inputs.project == '' || inputs.project == 'all' || inputs.project == 'omarchy-shell')
        run: node scripts/verify-omarchy-evidence.mjs tests/e2e/midscene_run

      - name: Write test results to Summary
        if: always()
        run: |
          {
            found=false
            for result in tests/e2e/.midscene/test-results/*/result.md; do
              [ -f "$result" ] || continue
              found=true
              # The native report link is local to the downloaded artifact.
              sed '/^\[Open the Midscene Test report ↗\](/d' "$result"
              echo
            done
            if [ "$found" = false ]; then
              echo "Midscene did not produce a test result. Check the preceding steps for setup or model verification failures."
              echo
            fi
            echo "[Download test artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

  pages-report:
    name: GitHub Pages report
    needs: omarchy-e2e
    if: >-
      always() &&
      !cancelled() &&
      needs.omarchy-e2e.outputs.report-artifact-id != '' &&
      (inputs.project == '' || inputs.project == 'all') &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-midscene-report.yml
    with:
      artifact-name: omarchy-midscene-e2e-report
      report-label: Omarchy 4.0.3
      summary-title: Omarchy
      report-groups: >-
        [{"role":"primary","label":"Doubao Say","projects":["omarchy-product"]},{"role":"auxiliary","label":"Omarchy visual checks","projects":["omarchy-shell"]}]
      run-result: ${{ needs.omarchy-e2e.result }}
