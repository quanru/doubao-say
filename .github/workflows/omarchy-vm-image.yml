name: Build Omarchy VM image

on:
  workflow_dispatch:
  push:
    branches: [ci/midscene-e2e]
    paths:
      - "tests/e2e/.rebuild-omarchy-vm"
      - "tests/e2e/install-omarchy-vm.sh"
      - "tests/e2e/prepare-omarchy-host.sh"
      - "tests/e2e/publish-omarchy-vm.sh"
      - "tests/e2e/omarchy-vm.env"

permissions:
  contents: read
  packages: write

concurrency:
  group: omarchy-vm-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Install and publish Omarchy base VM
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Install Omarchy from the verified official ISO
        run: tests/e2e/install-omarchy-vm.sh

      - name: Sign in to GitHub Container Registry
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ github.token }}

      - name: Publish versioned Omarchy base VM
        run: tests/e2e/publish-omarchy-vm.sh

      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-vm-image-installer-evidence
          path: .midscene-omarchy/omarchy-iso/test-runs/**/runs/**
          if-no-files-found: warn
          retention-days: 3
