name: Omarchy 15184 review-only acceptance
on:
  push:
    branches: [acceptance/omarchy-15184-a1ead6b3]
    paths: [acceptance/omarchy-15184/ci/.run-acceptance]
  workflow_dispatch:
    inputs:
      approved_visibility_and_cost:
        description: Approval recorded for this repository visibility, model and runner costs
        required: true
        type: boolean
        default: false
      builder_image:
        description: Pinned Arch AMD64 builder image
        required: true
        type: string
        default: 'ghcr.io/archlinux/archlinux@sha256:86092797e32aa19d3f45a831b2873cf557c21c5280e9d197ca7a43c8ea79bcd3'
      max_requests:
        description: Approved maximum upstream requests (1-60, includes retries)
        required: true
        default: '60'
        type: string
permissions:
  contents: read
concurrency:
  group: omarchy-15184-review-v2
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'quanru/doubao-say' && (github.event_name == 'push' || inputs.approved_visibility_and_cost)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: acceptance/omarchy-15184
    timeout-minutes: 150
    env:
      ACCEPTANCE_DISPOSABLE_CI: '1'
      ACCEPTANCE_SUITE: gui
      BUILDER_IMAGE: ${{ inputs.builder_image || 'ghcr.io/archlinux/archlinux@sha256:86092797e32aa19d3f45a831b2873cf557c21c5280e9d197ca7a43c8ea79bcd3' }}
      MAX_REQUESTS: ${{ inputs.max_requests || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Validate local harness
        run: python3 ci/validate.py
      - name: Build and boot full candidate (no model credentials)
        run: bash ci/prepare-runner.sh
      - name: Build pinned Midscene for real GUI evidence (no inference)
        run: bash ci/build-midscene.sh
      - name: Install locked Midscene dependencies
        run: npm --prefix ci ci --ignore-scripts
      - name: Complete three real GUI remove/add/restore rounds (no inference)
        timeout-minutes: 25
        run: bash ci/run-roi.sh
      - name: Restore and package evidence
        if: always()
        run: bash ci/finalize.sh
      - name: Export sanitized review bundle through job log (no artifact storage)
        if: always()
        run: python3 ci/export-evidence-log.py
