cases:
  - name: Complete Doubao Say onboarding on a real desktop
    steps:
      - aiAssert: The visible Doubao Say window is on Sign in, says the user is not signed in, and shows Open Doubao sign-in.
      - aiAct: Click Open Doubao sign-in exactly once, then stop immediately.
      - wait: { duration: 1500 }
      - aiAssert: A Synthetic Doubao sign-in window is visible and explicitly says it is CI-only, makes no network request, and uses no real credentials.
      - aiAct: In the Synthetic Doubao sign-in window, click Simulate successful sign-in exactly once, then stop immediately.
      - aiAssert: The synthetic sign-in window closed and Doubao Say automatically advanced to the Microphone step with a right-arrow Next button in the fixed top navigation.
      - aiAct: On the Microphone step, click Check microphone · 3 seconds exactly once and wait for the result.
      - aiAct: Scroll down inside the light-gray central content panel until the microphone check result below the button is visible.
      - aiAssert: A visible message says Microphone is working and instructs the user to continue to the trigger key step.
      - aiAct: Click the right-arrow Next button in the Doubao Say fixed top navigation exactly once. Do not click it a second time.
      - aiAssert: The current Doubao Say step is Trigger key.
      - aiAct: Stay on Trigger key. Scroll inside the light-gray central content panel until the Voice polishing heading and its controls are visible.
      - aiAct: On Trigger key, click Test endpoint in the visible Voice polishing section and wait for the endpoint result.
      - aiAct: If needed, scroll down slightly inside the central content panel until Synthetic endpoint response is visible below Endpoint works. Keep both results on screen.
      - aiAssert: A visible message says the endpoint works and includes Synthetic endpoint response.
      - aiAct: Click the right-arrow Next button in the fixed top navigation exactly once. Do not click it a second time.
      - aiAssert: The current Doubao Say step is Voice test.
      - aiAssert: The Voice test heading and introductory text are clearly visible near the top of the current content panel.
      - aiTap: Start voice test button in the Voice test content panel
      - wait: { duration: 750 }
      - aiAssert: The Voice test shows Synthetic voice test transcript and offers both Finish & check result and Cancel test.
      - aiTap: Finish & check result button in the Voice test content panel
      - wait: { duration: 750 }
      - aiAct: Scroll down inside the central content panel until the voice test result below the setup controls is visible.
      - aiAssert: A visible message says Voice test passed and confirms that nothing was pasted or sent; Finish setup is enabled.
      - aiTap: Enabled Finish setup button in the Voice test content panel
      - wait: { duration: 500 }
      - aiAssert: The Finish setup button changed to a disabled visible status saying Setup completed by the synthetic E2E fixture.
