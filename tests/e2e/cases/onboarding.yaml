cases:
  - name: Complete Doubao Say onboarding on a real desktop
    tags: [shard-1]
    steps:
      - aiAssert: The visible Doubao Say window is on Sign in and says the user is not signed in.
      - aiTap: The large blue full-width Open Doubao sign-in button near the bottom of the central Sign in panel, around 50% width and 73% screen height
      - aiWaitFor:
          prompt: The modal titled CI-ONLY SYNTHETIC DOUBAO SIGN-IN is visible and says it makes no network request and uses no real credentials.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiTap: The blue Simulate successful sign-in button in the CI-only modal, around 50% width and 43% screen height
      - aiWaitFor:
          prompt: The synthetic sign-in window is closed and Doubao Say is on the Microphone step.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Microphone step shows Check microphone · 3 seconds and the right-arrow Next button in the fixed top navigation.
      - aiTap: Check microphone · 3 seconds button on the Microphone step
      - aiWaitFor:
          prompt: The visible feedback says Microphone is working and instructs the user to continue to the trigger key step.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The visible microphone result says Microphone is working.
      - aiTap: Right-arrow Next button in the fixed top navigation
      - aiScroll:
          options:
            direction: down
            scrollType: singleAction
            distance: 500
      - aiWaitFor:
          prompt: The Trigger key page is visible and the complete Voice polishing model guidance can be read.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The model guidance recommends a small, fast model with thinking off, names DeepSeek Flash and Gemini 2.5 Flash-Lite, and warns that large reasoning models may exceed five seconds and fall back to the original text.
      - aiAct: Test the Voice polishing endpoint.
      - aiWaitFor:
          prompt: The Voice polishing result says Endpoint works and includes Synthetic endpoint response.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The visible endpoint result says Endpoint works and includes Synthetic endpoint response.
      - aiTap: Right-arrow Next button in the fixed top navigation
      - aiWaitFor:
          prompt: The Voice test page is visible and Start voice test is available.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Voice test heading and introductory text are clearly visible, and Start voice test is available.
      - aiAct: Start the voice test.
      - aiWaitFor:
          prompt: Synthetic voice test transcript is visible, and both Finish & check result and Cancel test are available.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Voice test shows Synthetic voice test transcript and offers both Finish & check result and Cancel test.
      - aiAct: Finish the active voice test and check its result.
      - aiWaitFor:
          prompt: The Listening overlay is gone and the visible feedback says Voice test passed and nothing was pasted or sent.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: Start voice test is available again, and the visible feedback says Voice test passed and nothing was pasted or sent.
      - aiAct: Activate the enabled Finish setup control whose label says Voice test passed and nothing pasted or sent.
      - aiWaitFor:
          prompt: The setup control is disabled and says Setup completed by the synthetic E2E fixture.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The visible disabled setup control says Setup completed by the synthetic E2E fixture.
