cases:
  - name: Cancel sign-in and retry
    tags: [shard-1]
    steps:
      - aiAssert: The current step is Sign in, the page says Not signed in, and the large blue Open Doubao sign-in button is visible.
      - aiTap: The large blue full-width Open Doubao sign-in button near the bottom of the central Sign in panel, around 50% width and 73% screen height
      - aiWaitFor:
          prompt: The modal titled CI-ONLY SYNTHETIC DOUBAO SIGN-IN is visible and says it makes no network request and uses no real credentials.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - computer.keyPress: { keyName: Escape }
      - aiWaitFor:
          prompt: The synthetic sign-in window is gone and Doubao Say remains on Sign in.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: Doubao Say remains on Sign in and the right-arrow Next button is disabled.
      - aiTap: The large blue full-width Open Doubao sign-in button near the bottom of the central Sign in panel, around 50% width and 73% screen height
      - aiWaitFor:
          prompt: The CI-only Synthetic Doubao sign-in window is visible again.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiTap: The blue Simulate successful sign-in button in the CI-only modal, around 50% width and 43% screen height
      - aiWaitFor:
          prompt: The sign-in window is closed and Doubao Say has advanced to the Microphone step.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: Doubao Say is on the Microphone step and no synthetic sign-in window is open.

  - name: Preserve signed-in account across backward navigation
    tags: [shard-4]
    steps:
      - aiAssert: The visible Doubao Say window starts on the Sign in step and says the user is not signed in.
      - aiTap: The large blue full-width Open Doubao sign-in button near the bottom of the central Sign in panel, around 50% width and 73% screen height
      - aiWaitFor:
          prompt: The CI-only Synthetic Doubao sign-in window is visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The synthetic sign-in window says it makes no network request and uses no real credentials.
      - aiTap: The blue Simulate successful sign-in button in the CI-only modal, around 50% width and 43% screen height
      - aiWaitFor:
          prompt: The sign-in window is closed and Doubao Say has advanced to the Microphone step.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiTap: Left-arrow Previous button in the fixed top navigation
      - aiWaitFor:
          prompt: The Sign in step shows the signed-in account status and Sign in again or change account.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Sign in step shows the heading Your voice, wherever you type; left-arrow Previous is disabled, right-arrow Next is enabled, and the account status says Signed in.
      - aiAct: Continue to the Microphone step.
      - aiWaitFor:
          prompt: The Microphone step shows Let's make sure we can hear you.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Microphone step is visible and no synthetic sign-in window is open.

  - name: Require an enabled trigger and retain the replacement
    tags: [shard-4]
    steps:
      - fixture.prepare: { mode: trigger-settings }
      - aiAssert: The Trigger key step shows Choose how to start speaking and Voice polishing is enabled.
      - aiTap: The trigger selection dropdown currently showing fn
      - aiTap: Disabled option in the open trigger selection dropdown
      - aiAssert: Active trigger says Disabled and Voice polishing has not changed.
      - aiTap: Right-arrow Next button in the fixed top navigation
      - aiAssert: The current step is still Trigger key and the message Choose an enabled trigger to continue is visible.
      - aiTap: The trigger selection dropdown currently showing Disabled
      - aiTap: F8 option in the open trigger selection dropdown
      - aiAssert: Active trigger shows F8 and F8 is selected in the trigger dropdown.
      - aiAct: Continue to Voice test.
      - aiWaitFor:
          prompt: Voice test shows Try a sentence. Nothing gets pasted and the right-arrow Next button is disabled.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiTap: Left-arrow Previous button in the fixed top navigation
      - aiWaitFor:
          prompt: The Trigger key step is visible again.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Trigger key step still shows Active trigger F8 and F8 is selected in the trigger dropdown.

  - name: Toggle polishing without losing configuration
    tags: [shard-3]
    steps:
      - fixture.prepare: { mode: trigger-settings }
      - aiScroll:
          options: { direction: down, scrollType: singleAction, distance: 500 }
      - aiWaitFor:
          prompt: The Trigger key step and the Voice polishing switch are visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiTap: The enabled Voice polishing switch at the upper right of the Voice polishing section
      - aiAssert: Voice polishing disabled is visible, the switch is off, and the polishing Base URL and Model fields are hidden.
      - aiTap: The disabled Voice polishing switch at the upper right of the Voice polishing section
      - aiScroll:
          options: { direction: down, scrollType: singleAction, distance: 500 }
      - aiWaitFor:
          prompt: Voice polishing is enabled and its Model input is visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Voice polishing switch is on and the Model input contains exactly synthetic-model.

  - name: Recover from an endpoint failure
    tags: [shard-2]
    steps:
      - fixture.prepare: { mode: trigger-settings }
      - aiScroll:
          options: { direction: down, scrollType: singleAction, distance: 500 }
      - computer.inputText: { target: The text entry to the right of Model containing synthetic-model, value: ci-fail-model, point: { x: 850, y: 477 } }
      - aiTap: Test endpoint button in the Voice polishing section
      - aiWaitFor:
          prompt: The endpoint feedback contains Synthetic endpoint unavailable and the retry button says Test failed — try again.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The endpoint failure and its enabled retry button are both visible.
      - computer.inputText: { target: The text entry to the right of Model containing ci-fail-model, value: ci-ok-model, point: { x: 850, y: 477 } }
      - aiTap: Test failed — try again button in the Voice polishing section
      - aiWaitFor:
          prompt: The endpoint result contains Synthetic endpoint response and the button says Endpoint works.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The previous Synthetic endpoint unavailable error is gone and the successful endpoint result is visible.

  - name: Microphone check gates setup completion
    tags: [shard-4]
    steps:
      - fixture.prepare: { mode: microphone-gate }
      - aiAssert: The visible Doubao Say window starts on the Microphone step, shows Synthetic microphone one, and offers Check microphone · 3 seconds.
      - aiTap: Right-arrow Next button in the fixed top navigation
      - aiScroll:
          options: { direction: down, scrollType: singleAction, distance: 500 }
      - aiWaitFor:
          prompt: Voice test is visible and Finish setup is fully visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Finish setup button is visibly disabled.
      - aiAct: Return to Microphone and run Check microphone · 3 seconds.
      - aiWaitFor:
          prompt: The visible feedback says Microphone is working and instructs the user to continue to the trigger key step.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The microphone result says Microphone is working and Synthetic microphone one remains selected.
      - aiTap: Right-arrow Next button in the fixed top navigation
      - aiScroll:
          options: { direction: down, scrollType: singleAction, distance: 500 }
      - aiWaitFor:
          prompt: Voice test is visible and Finish setup is fully visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Finish setup button is visibly enabled.

  - name: Complete and cancel a voice test safely
    tags: [shard-3]
    steps:
      - fixture.prepare: { mode: voice-test }
      - aiScroll:
          options: { direction: down, scrollType: singleAction, distance: 500 }
      - aiWaitFor:
          prompt: Voice test is visible and the disabled Finish setup control is fully visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The setup control is disabled before any voice test passes.
      - aiTap: Start voice test button in the Voice test section
      - aiWaitFor:
          prompt: Synthetic voice test transcript is visible, and both Finish & check result and Cancel test are available.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The listening voice test has a synthetic transcript and offers both finish and cancel actions.
      - aiTap: Cancel test button in the active voice test
      - aiWaitFor:
          prompt: The Listening overlay is gone and the visible feedback says Voice test cancelled and nothing was pasted or sent.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: Start voice test is available again, the transcript is empty, and the visible feedback says Voice test cancelled and nothing was pasted or sent.
      - aiScroll:
          options: { direction: down, scrollType: singleAction, distance: 500 }
      - aiWaitFor:
          prompt: The cancelled voice-test result and the disabled Finish setup control are fully visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Finish setup button is visibly disabled, and the voice-test feedback says Voice test cancelled and nothing was pasted or sent.
      - aiTap: Start voice test button in the Voice test section
      - aiWaitFor:
          prompt: Synthetic voice test transcript is visible and Finish & check result is available again.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAct: Finish the active voice test and check its result.
      - aiWaitFor:
          prompt: The Listening overlay is gone and the visible feedback says Voice test passed and nothing was pasted or sent.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: Start voice test is available again, and the enabled setup control says Voice test passed and nothing pasted or sent.

  - name: Switch to Volcengine and validate credentials
    tags: [shard-3]
    steps:
      - fixture.prepare: { mode: volcengine }
      - aiAssert: The visible Doubao Say window starts on Sign in with Doubao account selected and right-arrow Next disabled.
      - aiTap: The Recognition service dropdown currently showing Doubao account
      - aiTap: Volcengine API option in the open Recognition service dropdown
      - aiWaitFor:
          prompt: The page title is Recognition and the empty API Key field is visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: Open Doubao sign-in is hidden, and both Test API key and right-arrow Next are disabled while the API Key is empty.
      - aiAct: Enter synthetic-ci-key in the API Key field.
      - aiWaitFor:
          prompt: The API Key field has a non-empty masked value and Test API key is enabled.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The API Key is visibly saved as a masked non-empty value.
      - aiTap: Test API key button on the Recognition step
      - aiWaitFor:
          prompt: The result says API key accepted by synthetic endpoint and the page reports that the official API is ready.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The accepted API key result and official API ready state are both visible.
      - aiTap: Right-arrow Next button in the fixed top navigation
      - aiWaitFor:
          prompt: The Microphone step shows Let's make sure we can hear you.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The current step is Microphone.

  - name: Changing microphone requires another check
    tags: [shard-2]
    steps:
      - fixture.prepare: { mode: microphone-change }
      - aiTap: The microphone dropdown currently showing Synthetic microphone one
      - aiTap: Synthetic microphone two option in the open microphone dropdown
      - aiWaitFor:
          prompt: The visible feedback says Microphone saved and requires a new three-second check.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiTap: Right-arrow Next button in the fixed top navigation
      - aiScroll:
          options: { direction: down, scrollType: singleAction, distance: 500 }
      - aiWaitFor:
          prompt: Voice test is visible and Finish setup is fully visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Finish setup button is visibly disabled.
      - aiTap: Left-arrow Previous button in the fixed top navigation
      - aiWaitFor:
          prompt: The Microphone step and Check microphone · 3 seconds button are visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiTap: Check microphone · 3 seconds button on the Microphone step
      - aiWaitFor:
          prompt: The visible feedback says Microphone is working and Synthetic microphone two remains selected.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The microphone result says Microphone is working and Synthetic microphone two remains selected.
      - aiTap: Right-arrow Next button in the fixed top navigation
      - aiScroll:
          options: { direction: down, scrollType: singleAction, distance: 500 }
      - aiWaitFor:
          prompt: Voice test is visible and Finish setup is fully visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Finish setup button is visibly enabled.

  - name: Capture and retain a custom trigger shortcut
    tags: [shard-2]
    steps:
      - fixture.prepare: { mode: shortcut-capture }
      - aiTap: The trigger selection dropdown currently showing fn
      - aiTap: Record a shortcut… option in the open trigger selection dropdown
      - aiWaitFor:
          prompt: The active trigger and trigger dropdown both show the control symbol ⌃ plus F8.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The active and selected trigger is the custom shortcut ⌃ plus F8.
      - aiTap: Right-arrow Next button in the fixed top navigation
      - aiWaitFor:
          prompt: Voice test is visible.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiTap: Left-arrow Previous button in the fixed top navigation
      - aiWaitFor:
          prompt: Trigger key is visible again and still shows the custom shortcut.
          options: { timeoutMs: 30000, checkIntervalMs: 1000 }
      - aiAssert: The Trigger key page still shows ⌃ plus F8 as both the active and selected trigger.
