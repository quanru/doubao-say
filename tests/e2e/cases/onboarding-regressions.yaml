cases:
  - name: Cancel sign-in and retry
    steps:
      - aiAct: "Verify the current step is Sign in, the account is not signed in, and both left-arrow Previous and right-arrow Next in the fixed top navigation are disabled."
      - aiAct: "Click Open Doubao sign-in exactly once, then stop."
      - aiAct: "Verify the CI-only Synthetic Doubao sign-in window is visible. Close only that synthetic window using its title-bar close button, without clicking Simulate successful sign-in."
      - aiAct: "Verify the synthetic sign-in window is gone, Doubao Say still shows Sign in and Not signed in, right-arrow Next remains disabled, and Open Doubao sign-in is available."
      - aiAct: "Verify the visible Doubao Say window starts on the Sign in step, says the user is not signed in, and shows an Open Doubao sign-in button. Do not click anything."
      - aiAct: "Click Open Doubao sign-in exactly once, then stop immediately."
      - aiAct: "Verify a Synthetic Doubao sign-in window is visible and explicitly says it is CI-only, makes no network request, and uses no real credentials. Do not click anything."
      - aiAct: "In the Synthetic Doubao sign-in window, click Simulate successful sign-in exactly once, then stop immediately."
      - aiAct: "Verify the synthetic sign-in window closed and the visible Doubao Say window automatically advanced to the Microphone step with a right-arrow Next button in the fixed top navigation."
  - name: Preserve signed-in account across backward navigation
    steps:
      - aiAct: "Verify the visible Doubao Say window starts on the Sign in step, says the user is not signed in, and shows an Open Doubao sign-in button. Do not click anything."
      - aiAct: "Click Open Doubao sign-in exactly once, then stop immediately."
      - aiAct: "Verify a Synthetic Doubao sign-in window is visible and explicitly says it is CI-only, makes no network request, and uses no real credentials. Do not click anything."
      - aiAct: "In the Synthetic Doubao sign-in window, click Simulate successful sign-in exactly once, then stop immediately."
      - aiAct: "Verify the synthetic sign-in window closed and the visible Doubao Say window automatically advanced to the Microphone step with a right-arrow Next button in the fixed top navigation."
      - aiAct: "Scroll to the bottom of the Microphone central content panel, then click left-arrow Previous in the fixed top navigation exactly once and stop."
      - aiAct: "Verify the Sign in step shows the heading Your voice, wherever you type near the top of the content without scrolling, and left-arrow Previous is disabled while right-arrow Next is enabled."
      - aiAct: "Scroll within the Sign in content if needed. Verify it says Signed in and shows Sign in again / change account. Do not open sign-in."
      - aiAct: "Click right-arrow Next in the fixed top navigation exactly once, then stop."
      - aiAct: "Verify the Microphone step and its heading Let's make sure we can hear you are visible without scrolling, and no synthetic sign-in window is open."
  - name: Require an enabled trigger and retain the replacement
    steps:
      - aiAct: "Verify the visible Doubao Say window starts on the Sign in step, says the user is not signed in, and shows an Open Doubao sign-in button. Do not click anything."
      - aiAct: "Click Open Doubao sign-in exactly once, then stop immediately."
      - aiAct: "Verify a Synthetic Doubao sign-in window is visible and explicitly says it is CI-only, makes no network request, and uses no real credentials. Do not click anything."
      - aiAct: "In the Synthetic Doubao sign-in window, click Simulate successful sign-in exactly once, then stop immediately."
      - aiAct: "Verify the synthetic sign-in window closed and the visible Doubao Say window automatically advanced to the Microphone step with a right-arrow Next button in the fixed top navigation."
      - aiAct: "Click right-arrow Next in the fixed top navigation exactly once, then stop."
      - aiAct: "Verify the current step is Trigger key and the heading Choose how to start speaking is visible. Do not navigate."
      - aiAct: "In the trigger selection dropdown below Active trigger, select Disabled. Do not change Voice polishing."
      - aiAct: "Click right-arrow Next in the fixed top navigation exactly once, then stop."
      - aiAct: "Verify the current step is still Trigger key and the message Choose an enabled trigger to continue is visible."
      - aiAct: "In the trigger selection dropdown select F8. Verify Active trigger: F8 is visible and F8 is selected in the trigger dropdown."
      - aiAct: "Click right-arrow Next in the fixed top navigation exactly once, then stop."
      - aiAct: "Verify the current step is Voice test, the heading Try a sentence. Nothing gets pasted is visible, and right-arrow Next is disabled."
      - aiAct: "Click left-arrow Previous exactly once, then stop."
      - aiAct: "Verify the Trigger key step still shows Active trigger: F8 and F8 is selected in the trigger dropdown."
  - name: Toggle polishing without losing configuration
    steps:
      - aiAct: "Verify the visible Doubao Say window starts on the Sign in step, says the user is not signed in, and shows an Open Doubao sign-in button. Do not click anything."
      - aiAct: "Click Open Doubao sign-in exactly once, then stop immediately."
      - aiAct: "Verify a Synthetic Doubao sign-in window is visible and explicitly says it is CI-only, makes no network request, and uses no real credentials. Do not click anything."
      - aiAct: "In the Synthetic Doubao sign-in window, click Simulate successful sign-in exactly once, then stop immediately."
      - aiAct: "Verify the synthetic sign-in window closed and the visible Doubao Say window automatically advanced to the Microphone step with a right-arrow Next button in the fixed top navigation."
      - aiAct: "Click right-arrow Next in the fixed top navigation exactly once, then stop."
      - aiAct: "Verify the current step is Trigger key and the heading Choose how to start speaking is visible. Do not navigate."
      - aiAct: "Scroll inside the central content panel to Voice polishing. Turn off the switch beside that heading."
      - aiAct: "Verify Voice polishing disabled is visible, the switch is off, and the polishing Base URL and Model fields are hidden."
      - aiAct: "Turn on the switch beside Voice polishing."
      - aiAct: "Verify Voice polishing enabled is visible, the switch is on, and the Base URL and Model fields have returned. Scroll within the content if needed and verify Model still contains synthetic-model."
  - name: Recover from an endpoint failure
    steps:
      - aiAct: "Verify the visible Doubao Say window starts on the Sign in step, says the user is not signed in, and shows an Open Doubao sign-in button. Do not click anything."
      - aiAct: "Click Open Doubao sign-in exactly once, then stop immediately."
      - aiAct: "Verify a Synthetic Doubao sign-in window is visible and explicitly says it is CI-only, makes no network request, and uses no real credentials. Do not click anything."
      - aiAct: "In the Synthetic Doubao sign-in window, click Simulate successful sign-in exactly once, then stop immediately."
      - aiAct: "Verify the synthetic sign-in window closed and the visible Doubao Say window automatically advanced to the Microphone step with a right-arrow Next button in the fixed top navigation."
      - aiAct: "Click right-arrow Next in the fixed top navigation exactly once, then stop."
      - aiAct: "Verify the current step is Trigger key and the heading Choose how to start speaking is visible. Do not navigate."
      - aiAct: "Scroll inside the central content panel to Voice polishing. Replace the Model field with synthetic-failing-model, then click Test endpoint exactly once, scrolling within the panel if needed."
      - aiAct: "Verify the visible endpoint feedback says Endpoint test failed: Synthetic endpoint unavailable, and the enabled retry button says Test failed — try again."
      - aiAct: "Scroll upward inside the central content panel until the Voice polishing Model input is visible. Stop with that input on screen."
      - aiAct: "In the Model input, select all existing text and replace it with exactly synthetic-model. Do not change Base URL or API Key. Stop after entering the new value."
      - aiAct: "Verify the Model input now contains exactly synthetic-model, without the word failing. Do not click or type anything."
      - aiAct: "Scroll downward inside the central content panel until the Test failed — try again button is visible. Do not click it yet."
      - aiAct: "Click the Test failed — try again button exactly once to run a new endpoint test. Stop immediately after the click."
      - aiAct: "Scroll within the central content panel if needed until the endpoint result text below the retry button is fully visible."
      - aiAct: "Verify the endpoint result says Endpoint works: Synthetic endpoint response, the enabled button says Endpoint works, and the previous Synthetic endpoint unavailable error is no longer visible."
  - name: Microphone check gates setup completion
    steps:
      - fixture.prepare: { mode: microphone-gate }
      - aiAssert: The visible Doubao Say window starts on the Microphone step, shows Synthetic microphone one, and offers Check microphone · 3 seconds.
      - aiAct: Click right-arrow Next once to open Trigger key, then click right-arrow Next once more to open Voice test.
      - aiAssert: The current step is Voice test and Finish setup is disabled because the microphone check has not passed.
      - aiAct: Click left-arrow Previous once to open Trigger key, then click left-arrow Previous once more to return to Microphone.
      - aiAct: Click Check microphone · 3 seconds exactly once and wait for the result.
      - aiAct: Scroll down inside the central content panel until the microphone check result below the button is visible.
      - aiAssert: A visible message says Microphone is working and instructs the user to continue to the trigger key step.
      - aiAct: Click right-arrow Next once to open Trigger key, then click right-arrow Next once more to return to Voice test.
      - aiAssert: Finish setup is now enabled because both the synthetic microphone check and the preconfigured voice test have passed.
  - name: Complete and cancel a voice test safely
    steps:
      - fixture.prepare: { mode: voice-test }
      - aiAssert: The visible Doubao Say window starts on the Microphone step and the microphone is already configured.
      - aiAct: Click right-arrow Next once to open Trigger key, then click right-arrow Next once more to open Voice test.
      - aiAssert: The current step is Voice test, Start voice test is available, and Finish setup is disabled.
      - aiTap: Start voice test button in the Voice test content panel
      - wait: { duration: 750 }
      - aiAssert: Synthetic voice test transcript is visible, and both Finish & check result and Cancel test are available.
      - aiTap: Cancel test button in the Voice test content panel
      - wait: { duration: 500 }
      - aiAct: Scroll down inside the central content panel until the voice test result below the setup controls is visible.
      - aiAssert: A visible message says Voice test cancelled and confirms nothing was pasted or sent; the transcript is empty and Finish setup remains disabled.
      - aiTap: Start voice test button in the Voice test content panel
      - wait: { duration: 750 }
      - aiAssert: Synthetic voice test transcript is visible, and Finish & check result is available again.
      - aiTap: Finish & check result button in the Voice test content panel
      - wait: { duration: 750 }
      - aiAct: Scroll down inside the central content panel until the voice test result below the setup controls is visible.
      - aiAssert: A visible message says Voice test passed and confirms nothing was pasted or sent; Finish setup is enabled.
  - name: Switch to Volcengine and validate credentials
    steps:
      - fixture.prepare: { mode: volcengine }
      - aiAssert: The visible Doubao Say window starts on Sign in with Doubao account selected and right-arrow Next disabled.
      - aiAct: In Recognition service, select Volcengine API exactly once.
      - aiAssert: The page is now Recognition, shows an API Key field and Test API key button, hides Open Doubao sign-in, and keeps right-arrow Next disabled.
      - aiAct: Click Test API key without entering a key.
      - aiAssert: A visible validation message says Enter an API key first and right-arrow Next remains disabled.
      - aiAct: Enter synthetic-ci-key in the API Key field, wait until the interface says the key was saved automatically, then click Test API key exactly once and wait for the result.
      - aiAssert: The result says API key accepted by synthetic endpoint, the page reports that the official API is ready, and right-arrow Next is enabled.
  - name: Changing microphone requires another check
    steps:
      - fixture.prepare: { mode: microphone-change }
      - aiAssert: The visible Doubao Say window starts on the Microphone step with Synthetic microphone one selected.
      - aiAct: In the microphone dropdown, select Synthetic microphone two exactly once.
      - aiAct: Scroll down inside the central content panel until the microphone selection result below the controls is visible.
      - aiAssert: A visible message says Microphone saved and requires a new three-second check.
      - aiAct: Click right-arrow Next once to open Trigger key, then click right-arrow Next once more to open Voice test.
      - aiAssert: Finish setup is disabled because changing the microphone invalidated the previous microphone check.
      - aiAct: Click left-arrow Previous once to open Trigger key, then click left-arrow Previous once more to return to Microphone.
      - aiAct: Click Check microphone · 3 seconds exactly once and wait for the result.
      - aiAct: Scroll down inside the central content panel until the microphone check result below the button is visible.
      - aiAssert: The result says Microphone is working and Synthetic microphone two remains selected.
      - aiAct: Click right-arrow Next once to open Trigger key, then click right-arrow Next once more to return to Voice test.
      - aiAssert: Finish setup is enabled again after the replacement microphone passes its check.
  - name: Capture and retain a custom trigger shortcut
    steps:
      - fixture.prepare: { mode: shortcut-capture }
      - aiAct: From the Microphone step, click right-arrow Next exactly once to open Trigger key.
      - aiAssert: The Trigger key page shows Active trigger fn and a trigger selection dropdown.
      - aiAct: In the trigger selection dropdown, select Record a shortcut… exactly once and wait for the synthetic shortcut capture to finish.
      - aiAssert: The active trigger now shows the control symbol ⌃ plus F8, and the trigger dropdown displays that same custom shortcut.
      - aiAct: Click right-arrow Next once to open Voice test, then click left-arrow Previous once to return to Trigger key.
      - aiAssert: The Trigger key page still shows the custom ⌃ plus F8 shortcut as the active and selected trigger.
