cases:
  - name: System menu text and focused row are visible
    steps:
      - shell.openSystemMenu: {}
      - aiAssert: The Omarchy system menu is open, and its Shutdown item is clearly readable.
      - aiAssert: Exactly one row in the open system menu has a visible focus highlight or accent, and the highlight is rendered cleanly.
      - shell.closeSystemMenu: {}
      - shell.moveBarLeft: {}
      - aiAssert: The Omarchy bar is visible as a tall vertical bar docked to the left edge of the desktop, rather than a horizontal bar across the top or bottom.
