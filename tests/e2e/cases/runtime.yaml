cases:
  - name: Deliver one synthetic dictation to the focused target
    tags: [shard-3]
    steps:
      - fixture.prepare: { mode: runtime-delivery }
      - aiAssert: A Synthetic dictation target window is focused, its text field is empty, and the status says Idle with 0 deliveries.
      - computer.keyPress: { keyName: F8 }
      - wait: { duration: 1000 }
      - aiAssert: A dark Doubao Say overlay visibly says Listening to synthetic speech and shows Synthetic dictation is ready to deliver; the target field remains empty.
      - computer.keyPress: { keyName: F8 }
      - wait: { duration: 1200 }
      - aiAssert: The overlay is gone, the target field contains exactly Synthetic dictation delivered exactly once, and the status says Delivered once with 1 delivery.
  - name: Cancel synthetic dictation without delivering text
    tags: [shard-4]
    steps:
      - fixture.prepare: { mode: runtime-cancel }
      - aiAssert: A Synthetic dictation target window is focused, its text field is empty, and the status says Idle with 0 deliveries.
      - computer.keyPress: { keyName: F8 }
      - wait: { duration: 1000 }
      - aiAssert: The recording overlay is visible and the target field is still empty.
      - computer.keyPress: { keyName: Escape }
      - wait: { duration: 1000 }
      - aiAssert: The overlay is gone, the target field remains empty, and the status says Cancelled, no text delivered, and ready to try again.
      - computer.keyPress: { keyName: F8 }
      - wait: { duration: 1000 }
      - computer.keyPress: { keyName: F8 }
      - wait: { duration: 1200 }
      - aiAssert: A new attempt succeeds with exactly one delivered synthetic sentence and the status reports 1 delivery.
